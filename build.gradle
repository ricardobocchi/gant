plugins {
    id 'groovy'
    id 'java'
    id 'maven-publish'
}

group = 'org.codehaus.gant'
version = '2.1.0-groovy5'

repositories {
    mavenCentral()
}


dependencies {
    implementation 'org.apache.groovy:groovy-all:5.0.6'
    implementation 'commons-cli:commons-cli:1.11.0'
    implementation 'org.apache.ant:ant:1.10.17'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.ivy:ivy:2.5.3'
}

test {
    systemProperties['buildFrameworkIdentifier'] = 'Gradle'
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src/main/groovy']
        }
        java {
            srcDirs = [] // sem Java, se não houver
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
        java {
            srcDirs = []
        }

    }
    integTest {
        groovy {
            srcDirs = ['src/integTest/groovy']
        }
    }
}

tasks.register('integTest', Test) {
    dependsOn('classes')
    include file('src/integTest/groovy').absolutePath + '/org/codehaus/gant/ant/tests/*_Test.*'
}

tasks.withType(GroovyCompile) {
    groovyOptions.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

publishing {
    publications {
        mavenJava(MavenPublication) { // You can name this publication anything you like
            from components.java // For Java libraries
            // For Android libraries, you might use:
            // from components.release // or components.debug, depending on your build variants
        }
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}