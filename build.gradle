plugins {
    id 'groovy'
    id 'java'
    id 'maven-publish'
}

group = 'org.codehaus.gant'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy-all:4.0.29'
    implementation 'commons-cli:commons-cli:1.10.0'
    implementation 'org.apache.ant:ant:1.10.15'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.apache.ivy:ivy:2.5.3'
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src/main/groovy']
        }
        java {
            srcDirs = [] // sem Java, se não houver
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
        java {
            srcDirs = []
        }
    }
}

tasks.withType(GroovyCompile) {
    groovyOptions.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

publishing {
    publications {
        mavenJava(MavenPublication) { // You can name this publication anything you like
            from components.java // For Java libraries
            // For Android libraries, you might use:
            // from components.release // or components.debug, depending on your build variants
        }
    }
}